<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Leçon — Juboo</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/simulateur.css">
</head>
<body>
<div class="cadre">
  <div class="barre-site">
    <a href="index.html#lecons">← Leçons</a>
    <span class="titre" id="titre">Juboo</span>
  </div>
  <main class="scene" id="scene" aria-live="off"></main>
</div>
<script src="assets/simulateur.js"></script>
<script>
  // La leçon est un script : ce que le guide dit, et comment il juge le carnet.
  (() => {
    const id = new URLSearchParams(location.search).get('lecon') || 'cahier_digital';
    const s = document.createElement('script');
    s.src = 'lecons/' + encodeURIComponent(id) + '.js';
    s.onerror = () => {
      document.getElementById('scene').innerHTML =
        '<p class="erreur">Cette leçon n\'existe pas.<br><a href="index.html">Retour à l\'accueil</a></p>';
    };
    document.body.append(s);
  })();
</script>
<script src="assets/whatsapp.js"></script>
</body>
</html>
