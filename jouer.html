<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leçon — Juboo</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --orange:#F99F1B; --orange-fonce:#C97D00; --halo:#F5A623;
    --marine:#1A1B4B; --papier:#FBF7F2; --blanc:#FFFFFF;
    --bulle:#FAF6EF; --gris:#6B6F7B; --trait:#E6DDD0;
    --barre:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--papier);color:var(--marine);
    font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    overscroll-behavior:none}
  button{font:inherit;cursor:pointer}

  /* ---- La barre du site, au-dessus de l'écran de l'application ---- */
  .barre{height:var(--barre);display:flex;align-items:center;gap:8px;
    padding:0 12px;background:var(--blanc);border-bottom:1px solid var(--trait);
    font-size:14px;position:relative;z-index:30}
  .barre a,.barre button{color:var(--orange-fonce);font-weight:700;text-decoration:none;
    background:none;border:0;padding:10px 4px;font-size:14px}
  .barre .titre{flex:1;text-align:center;color:var(--gris);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}

  /* ---- La scène : plein écran sur téléphone, cadre de téléphone sur ordinateur ---- */
  .scene{position:relative;height:calc(100dvh - var(--barre));overflow:hidden;
    background:var(--papier)}
  @media (min-width:700px){
    body{background:#ECE5DA}
    .cadre{width:400px;margin:24px auto;border-radius:34px;overflow:hidden;
      border:10px solid #1D1D2B;box-shadow:0 24px 60px rgba(26,27,75,.25);background:var(--papier)}
    .scene{height:min(760px, calc(100dvh - 48px - 20px - var(--barre)))}
  }

  .ecran{position:absolute;left:50%;top:0;transform:translateX(-50%)}
  .ecran img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}

  /* ---- La zone à toucher et son battement (même rythme que l'application) ---- */
  .zone{position:absolute;border-radius:12px;cursor:pointer}
  .zone.bat::after{content:"";position:absolute;inset:-4px;border-radius:14px;
    border:3px solid var(--halo);box-shadow:0 0 0 4px rgba(245,166,35,.28),0 0 18px rgba(245,166,35,.55);
    animation:bat 3.4s infinite}
  @keyframes bat{
    0%{transform:scale(1)} 5.88%{transform:scale(1.18)} 12.35%{transform:scale(1)}
    18.24%{transform:scale(1.18)} 24.71%{transform:scale(1)} 30.59%{transform:scale(1.18)}
    37.06%{transform:scale(1)} 100%{transform:scale(1)}
  }
  @media (prefers-reduced-motion:reduce){.zone.bat::after{animation:none}}
  .fleche{position:absolute;width:0;height:0;border:14px solid transparent;
    border-top:18px solid var(--orange);transform:translate(-50%,-100%);
    animation:saut .8s ease-in-out infinite;pointer-events:none}
  @keyframes saut{50%{margin-top:-8px}}
  .valeur{position:absolute;display:flex;align-items:center;padding:0 4%;
    background:var(--blanc);border-radius:8px;color:#20203A;font-size:15px;pointer-events:none;
    border:2px solid var(--orange)}

  /* ---- Le guide, sa fiche et sa bulle ---- */
  .groupe{position:absolute;left:10px;right:10px;z-index:20;display:flex;
    flex-direction:column;gap:8px;transition:top .25s,bottom .25s}
  .groupe.bas{bottom:10px}
  .groupe.haut{top:10px}
  .ligne-guide{display:flex;align-items:flex-end;gap:8px}
  .guide{width:72px;height:72px;flex:none;border-radius:50%;background:var(--blanc);
    box-shadow:0 4px 12px rgba(26,27,75,.18);overflow:hidden}
  .guide img{width:100%;height:100%;object-fit:contain;padding:2px}
  .bulle{flex:1;background:var(--bulle);border-radius:18px 18px 18px 4px;
    box-shadow:0 8px 24px rgba(26,27,75,.18);padding:12px 14px}
  .etape{font-size:12px;color:var(--gris);margin-bottom:4px}
  .texte{font-size:16px;line-height:1.4;min-height:1.4em}
  .actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:10px}
  .actions .aide{flex:1;font-size:12px;color:var(--gris)}
  .suivant{background:var(--orange);color:var(--marine);border:0;border-radius:10px;
    padding:9px 16px;font-weight:700;font-size:15px}
  .suivant:active{transform:scale(.97)}

  .fiche{background:var(--bulle);border-radius:12px;border-left:4px solid var(--orange);
    box-shadow:0 6px 18px rgba(26,27,75,.15);padding:8px 12px;font-size:13px}
  .fiche .tete{display:flex;justify-content:space-between;align-items:center;
    color:var(--orange-fonce);font-weight:700;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;background:none;border:0;width:100%;padding:2px 0}
  .fiche dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:6px 0 0}
  .fiche dt{color:var(--gris)} .fiche dd{margin:0;text-align:right;font-weight:700}
  .fiche .note{margin-top:6px;font-size:12px;color:var(--gris)}
  .fiche.pliee dl,.fiche.pliee .note{display:none}

  /* ---- La fenêtre de saisie ---- */
  .voile{position:absolute;inset:0;background:rgba(26,27,75,.35);z-index:40;
    display:flex;align-items:flex-end}
  .feuille{background:var(--blanc);width:100%;border-radius:18px 18px 0 0;padding:16px 16px 20px}
  .feuille label{display:block;font-size:14px;color:var(--gris);margin-bottom:6px}
  .feuille input{width:100%;font-size:18px;padding:12px;border:2px solid var(--orange);
    border-radius:10px;outline:none;color:#20203A}
  .feuille .msg{min-height:20px;font-size:14px;color:#B3261E;margin-top:6px}
  .feuille .boutons{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
  .feuille .annuler{background:none;border:0;color:var(--orange-fonce);font-weight:700;padding:9px 12px}

  /* ---- La fin ---- */
  .fin{position:absolute;inset:0;z-index:50;background:rgba(26,27,75,.55);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .carte{background:var(--blanc);border-radius:20px;padding:24px 20px;text-align:center;max-width:340px}
  .carte img{width:110px}
  .carte h2{margin:8px 0 6px;font-size:22px}
  .carte p{margin:0 0 18px;color:var(--gris);line-height:1.45}
  .carte a{display:block;padding:13px;border-radius:12px;font-weight:700;text-decoration:none;margin-top:10px}
  .carte .principal{background:var(--orange);color:var(--marine)}
  .carte .second{border:2px solid var(--orange);color:var(--orange-fonce)}

  .maquette{position:absolute;top:8px;right:8px;z-index:25;background:var(--marine);color:#fff;
    font-size:11px;padding:4px 8px;border-radius:6px;opacity:.85;pointer-events:none}
  .erreur{padding:40px 20px;text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="cadre">
  <div class="barre">
    <a href="index.html">← Leçons</a>
    <span class="titre" id="titre">Juboo</span>
    <button type="button" id="recommencer">Recommencer</button>
  </div>
  <main class="scene" id="scene">
    <div class="ecran" id="ecran"><img id="image" alt=""></div>
    <div class="maquette" id="maquette" hidden>Maquette : écrans provisoires</div>
    <div class="groupe bas" id="groupe">
      <div class="fiche" id="fiche" hidden>
        <button type="button" class="tete" id="ficheTete"><span id="ficheTitre"></span><span id="ficheSigne">⌃</span></button>
        <dl id="ficheLignes"></dl>
        <div class="note" id="ficheNote"></div>
      </div>
      <div class="ligne-guide">
        <div class="guide"><img id="guide" src="assets/guide/explique.webp" alt="Le guide de Juboo"></div>
        <div class="bulle">
          <div class="etape" id="etape"></div>
          <div class="texte" id="texte" aria-live="polite"></div>
          <div class="actions">
            <span class="aide" id="aide"></span>
            <button type="button" class="suivant" id="suivant">Suivant ›</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<template id="modeleSaisie">
  <div class="voile">
    <form class="feuille">
      <label></label>
      <input autocomplete="off" autocapitalize="words" spellcheck="false">
      <div class="msg" aria-live="polite"></div>
      <div class="boutons">
        <button type="button" class="annuler">Annuler</button>
        <button type="submit" class="suivant">Valider</button>
      </div>
    </form>
  </div>
</template>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const scene = $('scene'), ecran = $('ecran'), image = $('image'), groupe = $('groupe');
  const id = new URLSearchParams(location.search).get('lecon') || 'pret_deux_sens';

  let lecon, pas = 0, ligne = 0, rates = 0, valeurs = {}, zoneEl = null, flecheEl = null;

  fetch('lecons/' + encodeURIComponent(id) + '.json')
    .then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(l => { lecon = l; demarrer(); })
    .catch(() => { scene.innerHTML = '<p class="erreur">Cette leçon n\'est pas encore disponible.<br><a href="index.html">Retour à l\'accueil</a></p>'; });

  function demarrer() {
    document.title = lecon.titre + ' — Juboo';
    $('titre').textContent = 'Leçon : ' + lecon.titre;
    $('maquette').hidden = !lecon.maquette;
    pas = 0; valeurs = {};
    afficherPas();
  }
  $('recommencer').onclick = () => { fermerSaisie(); document.querySelector('.fin')?.remove(); demarrer(); };

  // L'image est affichée entière, à la plus grande taille qui tient dans la scène.
  function cadrer() {
    if (!image.naturalWidth) return;
    const W = scene.clientWidth, H = scene.clientHeight;
    const k = Math.min(W / image.naturalWidth, H / image.naturalHeight);
    ecran.style.width = image.naturalWidth * k + 'px';
    ecran.style.height = image.naturalHeight * k + 'px';
    // Le guide, sa fiche et sa bulle restent DANS l'écran du téléphone. Posés sur toute la
    // largeur de la fenêtre, ils recouvraient la moitié basse de la capture dès que la fenêtre
    // était plus large que le téléphone — on ne voyait plus le bouton à toucher.
    // Sur un écran bas (ordinateur portable), le téléphone devient étroit : la bulle garde alors
    // une largeur lisible, quitte à déborder un peu de chaque côté.
    const largeur = Math.max(image.naturalWidth * k - 16, Math.min(340, W - 16));
    const gauche = (W - largeur) / 2;
    groupe.style.left = gauche + 'px';
    groupe.style.right = gauche + 'px';
    placerGroupe();
  }
  addEventListener('resize', cadrer);
  image.onload = cadrer;

  function precharger(i) {
    const p = lecon.pas[i];
    if (p) { const im = new Image(); im.src = lecon.dossier + p.ecran; }
  }

  function afficherPas() {
    const p = lecon.pas[pas];
    const src = lecon.dossier + p.ecran;
    if (!image.src.endsWith(src)) image.src = src;
    precharger(pas + 1); precharger(pas + 2);
    $('guide').src = 'assets/guide/' + (p.humeur || 'explique') + '.webp';
    $('etape').textContent = p.etape || '';
    montrerFiche(p.fiche);
    dessinerValeurs(p.ecran);
    retirerZone();
    ligne = 0; rates = 0;
    direLigne();
  }

  function direLigne() {
    const p = lecon.pas[pas];
    const derniere = ligne >= p.dire.length - 1;
    $('texte').textContent = p.dire[ligne];
    const btn = $('suivant');
    $('aide').textContent = '';
    if (!derniere) { btn.hidden = false; btn.textContent = 'Suivant ›'; }
    else if (p.action) {
      btn.hidden = true;
      $('aide').textContent = pas < 3 ? 'Touchez la zone qui clignote.' : '';
      poserZone(p.action);
    } else { btn.hidden = false; btn.textContent = p.bouton || 'Suivant ›'; }
    placerGroupe();
  }

  $('suivant').onclick = () => {
    const p = lecon.pas[pas];
    if (ligne < p.dire.length - 1) { ligne++; direLigne(); return; }
    if (p.fin) { finir(); return; }
    avancer();
  };

  function avancer() { pas++; afficherPas(); }

  // ---- La fiche de la situation ----
  let fichePliee = false, ficheCourante = null;
  function montrerFiche(cle) {
    const f = cle && lecon.fiches[cle];
    $('fiche').hidden = !f;
    if (!f) { ficheCourante = null; return; }
    if (ficheCourante !== cle) { fichePliee = false; ficheCourante = cle; }
    $('ficheTitre').textContent = f.titre;
    $('ficheLignes').innerHTML = '';
    f.lignes.forEach(([k, v]) => {
      const dt = document.createElement('dt'), dd = document.createElement('dd');
      dt.textContent = k; dd.textContent = v;
      $('ficheLignes').append(dt, dd);
    });
    $('ficheNote').textContent = f.note || '';
    $('ficheNote').hidden = !f.note;
    plier(fichePliee);
  }
  function plier(oui) {
    fichePliee = oui;
    $('fiche').classList.toggle('pliee', oui);
    $('ficheSigne').textContent = oui ? '⌄' : '⌃';
  }
  $('ficheTete').onclick = () => { plier(!fichePliee); placerGroupe(); };

  // ---- La zone à toucher ----
  function rectZone(z) {
    return { left: z.x * 100 + '%', top: z.y * 100 + '%', width: z.l * 100 + '%', height: z.h * 100 + '%' };
  }
  function poserZone(a) {
    retirerZone();
    zoneEl = document.createElement('div');
    zoneEl.className = 'zone' + (a.bat === false ? '' : ' bat');
    Object.assign(zoneEl.style, rectZone(a.zone));
    zoneEl.setAttribute('role', 'button');
    zoneEl.setAttribute('aria-label', a.libelle || lecon.pas[pas].dire.at(-1));
    zoneEl.onclick = e => { e.stopPropagation(); toucheZone(a); };
    ecran.append(zoneEl);
  }
  function retirerZone() { zoneEl?.remove(); zoneEl = null; flecheEl?.remove(); flecheEl = null; }

  // Un toucher à côté ne fait rien ; au troisième, une flèche montre la zone.
  ecran.addEventListener('click', () => {
    if (!zoneEl) return;
    if (++rates >= 3 && !flecheEl) {
      const z = lecon.pas[pas].action.zone;
      flecheEl = document.createElement('div');
      flecheEl.className = 'fleche';
      flecheEl.style.left = (z.x + z.l / 2) * 100 + '%';
      flecheEl.style.top = (z.y - 0.008) * 100 + '%';
      ecran.append(flecheEl);
    }
  });

  function toucheZone(a) {
    if (a.type === 'saisir') ouvrirSaisie(a);
    else { retirerZone(); avancer(); }
  }

  // ---- La saisie ----
  let voile = null;
  function ouvrirSaisie(a) {
    voile = $('modeleSaisie').content.firstElementChild.cloneNode(true);
    const form = voile.querySelector('form'), input = voile.querySelector('input'), msg = voile.querySelector('.msg');
    voile.querySelector('label').textContent = a.libelle;
    if (a.clavier === 'chiffres') { input.inputMode = 'numeric'; input.autocapitalize = 'off'; }
    if (a.clavier === 'telephone') { input.type = 'tel'; input.inputMode = 'tel'; input.autocapitalize = 'off'; }
    input.placeholder = a.attendu;
    voile.querySelector('.annuler').onclick = fermerSaisie;
    voile.onclick = e => { if (e.target === voile) fermerSaisie(); };
    form.onsubmit = e => {
      e.preventDefault();
      const v = input.value.trim();
      if (juste(a, v)) {
        (valeurs[lecon.pas[pas].ecran] ||= []).push({ zone: a.zone, texte: joli(a, v) });
        fermerSaisie(); retirerZone(); avancer();
      } else {
        msg.textContent = a.rappel || ('Le guide attend : ' + a.attendu + '.');
        input.select();
      }
    };
    scene.append(voile);
    setTimeout(() => input.focus(), 50);
  }
  function fermerSaisie() { voile?.remove(); voile = null; }

  function juste(a, v) {
    if (a.chiffres) return v.replace(/\D/g, '') === a.chiffres;
    if (a.accepte) return v.toLowerCase().includes(a.accepte);
    return v.toLowerCase() === a.attendu.toLowerCase();
  }
  // Ce qui s'affiche dans le champ : la forme propre, comme l'application l'écrirait.
  function joli(a, v) { return a.accepte ? a.attendu : (a.chiffres ? a.attendu : v); }

  function dessinerValeurs(nomEcran) {
    ecran.querySelectorAll('.valeur').forEach(e => e.remove());
    (valeurs[nomEcran] || []).forEach(({ zone, texte }) => {
      const d = document.createElement('div');
      d.className = 'valeur';
      Object.assign(d.style, rectZone(zone));
      d.textContent = texte;
      ecran.append(d);
    });
  }

  // ---- Le guide ne doit jamais cacher la zone qu'il demande de toucher ----
  function placerGroupe() {
    const a = lecon?.pas[pas]?.action;
    groupe.classList.add('bas'); groupe.classList.remove('haut');
    if (!a || !zoneEl) return;
    const zr = zoneEl.getBoundingClientRect();
    const couvre = () => {
      const g = groupe.getBoundingClientRect();
      return !(g.bottom < zr.top - 8 || g.top > zr.bottom + 8);
    };
    if (!couvre()) return;
    if (!$('fiche').hidden && !fichePliee) { plier(true); if (!couvre()) return; }
    groupe.classList.remove('bas'); groupe.classList.add('haut');
  }

  // ---- La fin ----
  function finir() {
    const d = document.createElement('div');
    d.className = 'fin';
    d.innerHTML = `<div class="carte">
      <img src="assets/guide/fete.webp" alt="">
      <h2>Ce n'était qu'un aperçu</h2>
      <p>Juboo fait bien plus que ça. Pour tout découvrir et vous en servir, installez
        l'application : elle s'installe par WhatsApp.</p>
      <a class="principal" data-whatsapp href="https://wa.me/221775543487">Recevoir Juboo sur WhatsApp</a>
      <a class="second" href="index.html#lecons">Essayer un autre espace</a>
    </div>`;
    scene.append(d);
  }
})();
</script>
<script src="assets/whatsapp.js"></script>
</body>
</html>
